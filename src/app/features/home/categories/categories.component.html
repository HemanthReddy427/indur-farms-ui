<section class="categories">

    <h2>

        Shop By Category

    </h2>

    <div class="grid">

        <div
            class="card"
            *ngFor="let category of categories"
            (click)="openCategory(category.name)">

            <div class="icon">

                {{category.icon}}

            </div>

            <h3>

                {{category.name}}

            </h3>

        </div>

    </div>

</section>
