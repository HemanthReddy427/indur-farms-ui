<nav class="navbar">

    <div class="logo">

        <a routerLink="/">

            <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#F5A524"/><path d="M5 25c6-2 10-2 12 0s6 2 12 0" stroke="#0B2E1F" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M17 20V11M17 14c-3 0-5-2-5-5 3 0 5 2 5 5zM17 14c3 0 5-2 5-5-3 0-5 2-5 5z" stroke="#0B2E1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>

            <span>Indur Farms</span>

        </a>

    </div>

    <ul class="nav-links">

        <li><a routerLink="/">Home</a></li>

        <li><a routerLink="/products">Products</a></li>

        <li><a routerLink="/categories">Categories</a></li>

        <li><a routerLink="/about">About</a></li>

        <li><a routerLink="/contact">Contact</a></li>

    </ul>

    <div class="search">

        <input
            type="text"
            placeholder="Search products...">

    </div>

    <div class="actions">

        <ng-container *ngIf="!isLoggedIn">

            <a
                routerLink="/login"
                class="login-btn">

                Login

            </a>

        </ng-container>

        <ng-container *ngIf="isLoggedIn">

            <div class="profile-menu">

                <div class="profile" tabindex="0">

                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>

                    {{userName}}

                </div>
                <div class="dropdown">
                     <a
                        *ngIf="isAdmin"
                        routerLink="/admin">
                        Admin Dashboard
                    </a>
                    <a routerLink="/profile">

                        My Profile

                    </a>

                    <a routerLink="/orders">

                        My Orders

                    </a>

                    <a routerLink="/addresses">

                        My Addresses

                    </a>

                    <a
                        href="javascript:void(0)"
                        (click)="logout()">

                        Logout

                    </a>

                </div>

            </div>

        </ng-container>

        <a
            routerLink="/cart"
            class="cart"
            aria-label="Cart">

            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg>

            <span class="badge">

                {{cartCount}}

            </span>

        </a>

    </div>

</nav>
